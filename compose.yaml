services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-medicitas}
      POSTGRES_USER: ${DB_USER:-medicitas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambie-esta-clave}
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - medicitas_postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medicitas} -d ${DB_DATABASE:-medicitas}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - medicitas_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyformedycitasapplication2026jwtsecretkey}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-medicitas}
      DB_USER: ${DB_USER:-medicitas}
      DB_PASSWORD: ${DB_PASSWORD:-cambie-esta-clave}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BFZBNheVRsFtA9hjMy6xp_LWIGtqKJSJxZ8hPD7aj8H_N6s4G1Q-7amGGhiOvZ4LScYzqMEqVJHAsbXcAUTbXRY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-zXq3mRdK8vW5yTn9pL2sH7jF4bN6cA1eG0iM8oQ3uY}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - medicitas_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - medicitas_network

volumes:
  medicitas_postgres_data:

networks:
  medicitas_network:
    driver: bridge
